<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNS Wakiga Orbit (2026) — Sys.T.Miyatake</title>
  <meta name="description" content="SYS.T.Miyatakeが管理・運営・更新している個人のウェブサイトに於ける，独自作品ページです．SNS Wakiga Orbit (2026) — Sys.T.Miyatake">
  <meta name="author" content="SYS.T.Miyatake">
  <meta name="copyright" content="(C)SYS.T.Miyatake">
  <link rel="icon" type="image/svg+xml" href="../media/svg-icon/favicon.svg">
    <style>
        :root {
            --bg-deep: #05060b;
            --bg-mid: #0b0f1e;
            --line: #7d8bff;
            --guide: #3a4066;
            --c-s1: #5eebff;
            --c-n: #ff5fd1;
            --c-s2: #ffd166;
            --dur-orbit: 9s;
            --hue-shift: 0deg;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--bg-deep);
            overflow: hidden;
            font-family: "Segoe UI", "Hiragino Sans", "Helvetica Neue", sans-serif;
        }

        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 45%, var(--bg-mid) 0%, var(--bg-deep) 70%);
        }

        /* ---- tap / hover target on each letter ---- */
        .letter-pos {
            cursor: pointer;
        }

        .hit {
            fill: #fff;
            fill-opacity: 0.001;
            pointer-events: fill;
        }

        /* ---- word reveal layer (Surveillance / Narcissism / Spectacle) ---- */
        .reveal-layer {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 6;
        }

        .reveal-dim {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, .6), rgba(0, 0, 0, 0) 68%);
            animation: dim-fade 2.5s ease forwards;
        }

        @keyframes dim-fade {
            0% {
                opacity: 0;
            }

            14% {
                opacity: 1;
            }

            72% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .reveal-word {
            position: relative;
            display: flex;
            font-family: Georgia, "Hiragino Mincho ProN", "Times New Roman", serif;
            font-style: italic;
            font-weight: 700;
            font-size: clamp(24px, 6.4vw, 52px);
            letter-spacing: .05em;
        }

        .rchar {
            display: inline-block;
            color: var(--wcolor, #fff);
            opacity: 0;
            transform: scale(.2) translateY(6px);
            filter: brightness(2.6) drop-shadow(0 0 0 var(--wcolor));
            animation-name: star-in, star-out;
            animation-duration: .55s, .7s;
            animation-timing-function: cubic-bezier(.2, 1.4, .4, 1), ease-in;
            animation-fill-mode: forwards, forwards;
            animation-delay: calc(var(--i) * 40ms), calc(1.55s + var(--i) * 16ms);
        }

        @keyframes star-in {
            0% {
                opacity: 0;
                transform: scale(.2) translateY(6px);
                filter: brightness(3.6) drop-shadow(0 0 16px var(--wcolor));
            }

            60% {
                opacity: 1;
                transform: scale(1.16) translateY(-2px);
                filter: brightness(1.5) drop-shadow(0 0 9px var(--wcolor));
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: brightness(1) drop-shadow(0 0 5px var(--wcolor));
            }
        }

        @keyframes star-out {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: brightness(1) drop-shadow(0 0 5px var(--wcolor));
            }

            100% {
                opacity: 0;
                transform: scale(.55) translateY(-16px);
                filter: brightness(2.4) drop-shadow(0 0 18px var(--wcolor));
            }
        }

        .rsparkle {
            position: absolute;
            color: var(--wcolor, #fff);
            opacity: 0;
            transform: scale(.3) rotate(0deg);
            animation: sparkle-life 1.9s ease-out forwards;
            text-shadow: 0 0 8px currentColor;
        }

        @keyframes sparkle-life {
            0% {
                opacity: 0;
                transform: scale(.2) rotate(0deg);
            }

            18% {
                opacity: 1;
                transform: scale(1.1) rotate(40deg);
            }

            55% {
                opacity: .85;
                transform: scale(.9) rotate(90deg);
            }

            100% {
                opacity: 0;
                transform: scale(.2) rotate(160deg);
            }
        }

        /* ---- ambient rotating conic backdrop ---- */
        .backdrop {
            position: absolute;
            width: 120vmin;
            height: 120vmin;
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                    rgba(94, 235, 255, 0.06), rgba(255, 95, 209, 0.06),
                    rgba(255, 209, 102, 0.06), rgba(94, 235, 255, 0.06));
            filter: blur(30px);
            animation: spin-slow 46s linear infinite;
            pointer-events: none;
        }

        @keyframes spin-slow {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---- starfieldofwakiga ---- */
        .stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #cfe0ff;
            border-radius: 50%;
            opacity: .25;
            animation-name: twinkle;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .15;
                transform: scale(1);
            }

            50% {
                opacity: .9;
                transform: scale(1.6);
            }
        }

        svg.orbit {
            width: min(78vmin, 560px);
            height: min(78vmin, 560px);
            overflow: visible;
            filter: hue-rotate(var(--hue-shift));
            transition: filter 1.2s ease;
        }

        .triangle {
            fill: none;
            stroke: var(--line);
            stroke-width: 2.4;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 6px rgba(125, 139, 255, 0.55));
            animation: triangle-breathe 6.5s ease-in-out infinite;
        }

        @keyframes triangle-breathe {

            0%,
            100% {
                stroke-opacity: .55;
            }

            50% {
                stroke-opacity: 1;
            }
        }

        .orbit-guide {
            fill: none;
            stroke: var(--guide);
            stroke-width: 1;
            stroke-dasharray: 2 6;
            opacity: .5;
            animation: guide-rotate 40s linear infinite;
            transform-origin: 200px 200px;
        }

        @keyframes guide-rotate {
            to {
                stroke-dashoffset: -200;
            }
        }

        /* ---- vertex ping rings ---- */
        .ping {
            fill: none;
            stroke-width: 2;
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
            animation: ping-burst var(--dur-orbit) ease-out infinite;
        }

        .ping1 {
            stroke: var(--c-s1);
            animation-delay: 0s;
        }

        .ping2 {
            stroke: var(--c-n);
            animation-delay: calc(var(--dur-orbit) / 3);
        }

        .ping3 {
            stroke: var(--c-s2);
            animation-delay: calc(var(--dur-orbit) * 2 / 3);
        }

        @keyframes ping-burst {
            0% {
                opacity: 0;
                transform: scale(.3);
            }

            2% {
                opacity: .9;
                transform: scale(.3);
            }

            9% {
                opacity: 0;
                transform: scale(2.4);
            }

            100% {
                opacity: 0;
                transform: scale(2.4);
            }
        }

        /* ---- letters: position layer (moves along the circle) ---- */
        .letter-pos {
            offset-path: path("M340,200 A140,140 0 1 1 60,200 A140,140 0 1 1 340,200");
            offset-rotate: 0deg;
            offset-distance: 0%;
            animation-name: orbit-move;
            animation-duration: var(--dur-orbit);
            animation-timing-function: cubic-bezier(.76, 0, .24, 1);
            animation-iteration-count: infinite;
        }

        #s1 {
            animation-delay: 0s;
        }

        #n {
            animation-delay: calc(var(--dur-orbit) * -1 / 3);
        }

        #s2 {
            animation-delay: calc(var(--dur-orbit) * -2 / 3);
        }

        @keyframes orbit-move {
            0% {
                offset-distance: 0%;
            }

            8% {
                offset-distance: 0%;
            }

            33.33% {
                offset-distance: 33.33%;
            }

            41.33% {
                offset-distance: 33.33%;
            }

            66.67% {
                offset-distance: 66.67%;
            }

            74.67% {
                offset-distance: 66.67%;
            }

            100% {
                offset-distance: 100%;
            }
        }

        /* ---- letters: hue-drift layer (independent long period → pseudo-random look) ---- */
        .letter-hue {
            animation-name: hue-drift;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        #s1 .letter-hue {
            animation-duration: 13.4s;
        }

        #n .letter-hue {
            animation-duration: 17.1s;
        }

        #s2 .letter-hue {
            animation-duration: 19.7s;
        }

        @keyframes hue-drift {
            from {
                filter: hue-rotate(0deg);
            }

            to {
                filter: hue-rotate(360deg);
            }
        }

        /* ---- letters: glow / scale / wobble layer ---- */
        .letter-fx text {
            font-weight: 800;
            font-size: 56px;
            text-anchor: middle;
            dominant-baseline: central;
            paint-order: stroke;
            animation-name: glow-pulse, wobble;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }

        #s1 .letter-fx text {
            fill: var(--c-s1);
            animation-duration: 2.3s, 5.2s;
        }

        #n .letter-fx text {
            fill: var(--c-n);
            animation-duration: 2.7s, 6.1s;
        }

        #s2 .letter-fx text {
            fill: var(--c-s2);
            animation-duration: 3.1s, 4.6s;
        }

        @keyframes glow-pulse {

            0%,
            100% {
                filter: drop-shadow(0 0 5px currentColor) drop-shadow(0 0 12px currentColor);
            }

            50% {
                filter: drop-shadow(0 0 12px currentColor) drop-shadow(0 0 26px currentColor);
            }
        }

        @keyframes wobble {

            0%,
            100% {
                transform: rotate(calc(var(--jit, 0) * 1deg)) scale(1);
            }

            50% {
                transform: rotate(calc(var(--jit, 0) * -1deg)) scale(1.08);
            }
        }

        /* ---- floating particles spawned by JS ---- */
        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: visible;
        }

        .credit {
            position: absolute;
            right: 16px;
            bottom: 12px;
            font-size: 12px;
            color: #8a94c9;
            opacity: .6;
            letter-spacing: .05em;
            pointer-events: none;
            z-index: 7;
        }

        .spark {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            pointer-events: none;
            animation: spark-life 1.1s ease-out forwards;
        }

        @keyframes spark-life {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(.2);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.001s !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>
    <div class="stage">
        <div class="backdrop"></div>
        <div class="stars" id="stars"></div>

        <svg class="orbit" viewBox="0 0 400 400">
            <circle class="orbit-guide" cx="200" cy="200" r="140"></circle>
            <polygon class="triangle" points="340,200 130,321.243 130,78.757"></polygon>

            <circle class="ping ping1" cx="340" cy="200" r="10"></circle>
            <circle class="ping ping2" cx="130" cy="321.243" r="10"></circle>
            <circle class="ping ping3" cx="130" cy="78.757" r="10"></circle>

            <g id="s1" class="letter-pos" data-word="Surveillance">
                <g class="letter-hue">
                    <g class="letter-fx">
                        <circle class="hit" cx="0" cy="0" r="32"></circle>
                        <text x="0" y="0">S</text>
                    </g>
                </g>
            </g>
            <g id="n" class="letter-pos" data-word="Narcissism">
                <g class="letter-hue">
                    <g class="letter-fx">
                        <circle class="hit" cx="0" cy="0" r="32"></circle>
                        <text x="0" y="0">N</text>
                    </g>
                </g>
            </g>
            <g id="s2" class="letter-pos" data-word="Spectacle">
                <g class="letter-hue">
                    <g class="letter-fx">
                        <circle class="hit" cx="0" cy="0" r="32"></circle>
                        <text x="0" y="0">S</text>
                    </g>
                </g>
            </g>
        </svg>

        <div class="particles" id="particles"></div>
        <div class="reveal-layer" id="revealLayer"></div>
        <div class="credit">© Sys.T.Miyatake, 2026</div>
    </div>

    <script>
        // ---------- starfieldofwakiga ----------
        const starsEl = document.getElementById('stars');
        for (let i = 0; i < 70; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = (Math.random() * 2 + 0.6).toFixed(1);
            s.style.width = s.style.height = size + 'px';
            s.style.left = (Math.random() * 100) + '%';
            s.style.top = (Math.random() * 100) + '%';
            s.style.animationDuration = (Math.random() * 4 + 2.5) + 's';
            s.style.animationDelay = (-Math.random() * 6) + 's';
            starsEl.appendChild(s);
        }

        // ---------- true-random per-loop variation ----------
        const palette = ['#5eebff', '#ff5fd1', '#ffd166', '#8bff9e', '#c792ff', '#ff8a5e', '#5ea9ff'];
        const letters = ['s1', 'n', 's2'];

        function shuffleLook() {
            letters.forEach(id => {
                const g = document.querySelector('#' + id + ' .letter-fx text');
                const color = palette[Math.floor(Math.random() * palette.length)];
                g.style.fill = color;
                document.querySelector('#' + id).style.setProperty('--jit', (Math.random() * 3 + 1).toFixed(2));
            });
            document.documentElement.style.setProperty('--hue-shift', (Math.random() * 40 - 20) + 'deg');
        }

        // re-roll the palette once per full orbit loop (uses S1's own cycle as the clock)
        const durSeconds = 9; // keep in sync with --dur-orbit
        setInterval(shuffleLook, durSeconds * 1000);
        shuffleLook();

        // ---------- spark bursts timed to vertex arrivals ----------
        const vertices = [
            { x: 340, y: 200, t: 0 },
            { x: 130, y: 321.243, t: durSeconds / 3 },
            { x: 130, y: 78.757, t: durSeconds * 2 / 3 }
        ];
        const svgEl = document.querySelector('svg.orbit');
        const particlesEl = document.getElementById('particles');

        function burst(vx, vy) {
            const rect = svgEl.getBoundingClientRect();
            const stageRect = document.querySelector('.stage').getBoundingClientRect();
            const scale = rect.width / 400;
            const cx = rect.left - stageRect.left + vx * scale;
            const cy = rect.top - stageRect.top + vy * scale;
            const n = 6 + Math.floor(Math.random() * 5);
            for (let i = 0; i < n; i++) {
                const p = document.createElement('div');
                p.className = 'spark';
                const angle = Math.random() * Math.PI * 2;
                const dist = 18 + Math.random() * 34;
                p.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
                p.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
                p.style.left = cx + 'px';
                p.style.top = cy + 'px';
                p.style.background = palette[Math.floor(Math.random() * palette.length)];
                p.style.animationDuration = (0.7 + Math.random() * 0.8) + 's';
                particlesEl.appendChild(p);
                p.addEventListener('animationend', () => p.remove());
            }
        }

        function scheduleBursts() {
            vertices.forEach(v => {
                setTimeout(() => burst(v.x, v.y), v.t * 1000);
            });
        }
        scheduleBursts();
        setInterval(scheduleBursts, durSeconds * 1000);

        // ---------- word reveal on tap (mobile) / hover (PC) ----------
        const revealLayer = document.getElementById('revealLayer');
        let revealToken = 0;

        function triggerReveal(id) {
            const s = sounds[id];
            if (s) {
                s.currentTime = 0;
                s.play().catch(() => { });
            }
            const groupEl = document.getElementById(id);
            const word = groupEl.dataset.word;
            const textEl = groupEl.querySelector('.letter-fx text');
            const color = getComputedStyle(textEl).fill || '#ffffff';
            const myToken = ++revealToken;

            revealLayer.innerHTML = '';

            const dim = document.createElement('div');
            dim.className = 'reveal-dim';
            revealLayer.appendChild(dim);

            const wrap = document.createElement('div');
            wrap.className = 'reveal-word';
            wrap.style.setProperty('--wcolor', color);
            [...word].forEach((ch, i) => {
                const span = document.createElement('span');
                span.className = 'rchar';
                span.style.setProperty('--i', i);
                span.textContent = ch;
                wrap.appendChild(span);
            });
            revealLayer.appendChild(wrap);

            const glyphs = ['✦', '✧', '⋆', '·', '✶'];
            for (let i = 0; i < 12; i++) {
                const sp = document.createElement('span');
                sp.className = 'rsparkle';
                sp.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
                sp.style.left = (50 + (Math.random() * 70 - 35)) + '%';
                sp.style.top = (50 + (Math.random() * 80 - 40)) + '%';
                sp.style.fontSize = (9 + Math.random() * 15) + 'px';
                sp.style.setProperty('--wcolor', color);
                sp.style.animationDelay = (Math.random() * 1.3) + 's';
                revealLayer.appendChild(sp);
            }

            setTimeout(() => {
                if (myToken === revealToken) revealLayer.innerHTML = '';
            }, 2600);
        }

        const hoverCapable = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        letters.forEach(id => {
            const el = document.getElementById(id);
            if (hoverCapable) {
                el.addEventListener('mouseenter', () => triggerReveal(id));
            }
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                triggerReveal(id);
            }, { passive: false });
            // fallback for click-based environments (e.g. hybrid devices)
            el.addEventListener('click', () => triggerReveal(id));
        });

        const sounds = {
            s1: new Audio('sounds/surveillance.mp3'),
            n: new Audio('sounds/narcissism.mp3'),
            s2: new Audio('sounds/spectacle.mp3')
        };
    </script>
</body>

</html>
